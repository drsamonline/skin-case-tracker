<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — HHMS Skin-Case Tracker</title>
<meta name="description" content="That page could not be found. Head back to the HHMS Skin-Case Tracker landing page or open the app.">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#0d9488">
<link rel="icon" href="/skin-case-tracker/play/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f8fafc;--surface:#fff;--ink:#0f172a;--body:#475569;--muted:#64748b;--line:#e2e8f0;--teal:#0d9488;--teal-dark:#0f766e;--teal-50:#f0fdfa;--teal-100:#ccfbf1;--radius:26px;
--sans:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--body);font-family:var(--sans);
background-image:radial-gradient(1000px 500px at 100% -10%,rgba(13,148,136,.08),transparent 60%),radial-gradient(800px 400px at -10% 20%,rgba(13,148,136,.05),transparent 55%);background-repeat:no-repeat;padding:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 18px 40px -24px rgba(15,23,42,.28),0 2px 8px -4px rgba(15,23,42,.08);padding:46px 40px;max-width:560px;text-align:center}
.mark{width:64px;height:64px;border-radius:20px;margin:0 auto 22px;background:linear-gradient(160deg,var(--teal),var(--teal-dark));display:grid;place-items:center;box-shadow:0 14px 26px -16px rgba(13,148,136,.95)}
.mark svg{width:34px;height:34px}
h1{color:var(--ink);font-size:1.7rem;margin:0 0 10px;letter-spacing:-.015em}
p{margin:0 0 26px;font-size:15.5px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:15px;padding:13px 22px;border-radius:999px;border:1px solid transparent;text-decoration:none;transition:transform .18s ease,box-shadow .18s ease}
.btn svg{width:18px;height:18px}
.btn-primary{background:linear-gradient(160deg,var(--teal),var(--teal-dark));color:#fff;box-shadow:0 14px 26px -16px rgba(13,148,136,.95)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:#cbd5e1}
.btn-ghost:hover{transform:translateY(-2px);border-color:var(--teal);color:var(--teal-dark)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.22em;color:var(--teal-dark);background:var(--teal-50);border:1px solid var(--teal-100);border-radius:999px;padding:6px 14px;display:inline-block;margin-bottom:20px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.3-7-9.5A4.5 4.5 0 0 1 12 8a4.5 4.5 0 0 1 7 3.5C19 16.7 12 21 12 21z"/><path d="M7.5 12.5h2l1.2-2 1.6 3.4 1.2-1.4h3"/></svg>
  </div>
  <span class="code">404</span>
  <h1>That page isn't here</h1>
  <p>The link may be out of date, or the page may have moved. The landing page and the app are both a click away.</p>
  <div class="row">
    <a class="btn btn-primary" href="/skin-case-tracker/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Back to the home page
    </a>
    <a class="btn btn-ghost" href="/skin-case-tracker/play/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9z"/></svg>
      Open the app
    </a>
  </div>
</main>
</body>
</html>
